
name: Build Daleeni APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create --platforms=android daleeni
          cp -r daleeni/android ./android
          cp daleeni/pubspec.yaml ./pubspec.yaml
          mkdir -p lib
          test -f lib/main.dart || echo "void main() {}" > lib/main.dart

      - name: Build APK
        run: flutter build apk --release

      - name: Publish APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: daleeni-v0.1.${{ github.run_number }}
          name: Daleeni APK ${{ github.run_number }}
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
