
name: Build Daleeni APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create --platforms=android daleeni
          cp -r daleeni/android ./android
          cp daleeni/pubspec.yaml ./pubspec.yaml
          mkdir -p lib
          test -f lib/main.dart || echo "void main() {}" > lib/main.dart

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: daleeni-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
